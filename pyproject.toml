[project]
name = "photodesk-engine"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["osxphotos==0.76.1", "ocrmac==1.0.1", "photoscript==0.5.3", "click>=8.1", "pyyaml>=6.0"]

[dependency-groups]
build = ["pyinstaller>=6.20,<7"]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin' and platform_release >= '22.0'"]
