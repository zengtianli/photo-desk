name: photo-desk
name_en: PhotoDesk
name_zh: 照片台
display_name: PhotoDesk · 照片台
form: mac
lifecycle: active
bundle_id: cyou.tianli.PhotoDesk
origin: own
description: 原生照片时间线与本地整理，App 内置同源 photodesk CLI
# 交付流程（SOP）事实：app_sop.py 据此检查轻量/测试、演示素材、推广页、装机与发布，字段说明见
# ~/Dev/tools/dev/lib/tools/macapp/app_sop.py 的 SOP_KEYS。
sop:
  # photodesk 在 App 包内（Contents/Resources/bin），与 GUI 同一引擎。子命令：timeline refresh audit photos
  # duplicates plan plans plan-show apply delete-check records progress settings doctor（App 功能），
  # 旧名别名 classify-plan/title-plan/triage/ocr-scan/classify-apply/title-apply，命令行工具 backup ocr-extract
  # shared-list dedup-export reconcile。删除照片只在 App 内。
  cli:
    commands: [photodesk]
  # 界面功能对照：从 Sources/ 的菜单、按钮、设置与快捷键动作逐项列出；写法见 app 技能 references/agent-cli.md。
  # human 的每一项都列在 photodesk --help 的“仅在窗口中”（tests/test_desk_cli.py 核对）。
  # config、update、shortcuts、login、automation、cancel 由 App 可执行文件自己执行（Sources/AgentCommands.swift），
  # 引擎只原样转交；automation、cancel 要 PhotoDesk 在运行，shortcuts 的改动在 PhotoDesk 运行时拒绝。
  agent_cli:
    readback: photodesk doctor
    features:
    - name: "我的时间线"
      command: "photodesk timeline"
    - name: "猫时间线 / 会议与工作 / 资料与截图"
      command: "photodesk timeline"
    - name: "时间线筛选（人物、猫的名字）"
      command: "photodesk timeline"
    - name: "查找人物、地点、日期或事件"
      command: "photodesk timeline"
    - name: "自动整理状态与识别进度"
      command: "photodesk timeline"
    - name: "继续查看更早的片段"
      command: "photodesk timeline"
    - name: "查看片段"
      command: "photodesk timeline"
    - name: "暂停自动整理 / 继续自动整理"
      command: "photodesk automation"
    - name: "全部照片"
      command: "photodesk photos"
    - name: "刷新照片"
      command: "photodesk photos"
    - name: "重复核对"
      command: "photodesk duplicates"
    - name: "重新分析重复照片"
      command: "photodesk refresh"
    - name: "图库概览"
      command: "photodesk audit"
    - name: "刷新图库"
      command: "photodesk refresh"
    - name: "读取默认图库"
      command: "photodesk refresh"
    - name: "选择图库…"
      command: "photodesk settings set"
    - name: "分类整理 / 截图与票据 / 敏感照片 / 照片标题（高级整理）"
      command: "photodesk plan"
    - name: "生成建议 / 重新分析"
      command: "photodesk plan"
    - name: "识别范围"
      command: "photodesk plan"
    - name: "搜索文件名、日期或建议"
      command: "photodesk plan-show"
    - name: "分组筛选"
      command: "photodesk plan-show"
    - name: "翻页"
      command: "photodesk plan-show"
    - name: "导出清单"
      command: "photodesk plan-show"
    - name: "快速预览 / 放大查看"
      command: "photodesk plan-show"
    - name: "上一张 / 下一张 / 关闭预览"
      human: "只在窗口里有意义：预览窗内的翻看与关闭"
    - name: "勾选、全选筛选结果、清空勾选"
      command: "photodesk apply"
    - name: "检查并写入"
      command: "photodesk apply"
    - name: "确认写入"
      command: "photodesk apply"
    - name: "选择片段、全选片段、取消选择"
      command: "photodesk delete-check"
    - name: "删除所选照片…"
      command: "photodesk delete-check"
    - name: "确认删除"
      human: "产品规定删除只在 App 内；PhotoKit 的系统确认弹窗须真人点，命令止于 delete-check"
    - name: "整理记录"
      command: "photodesk plans"
    - name: "刷新记录"
      command: "photodesk plans"
    - name: "打开计划"
      command: "photodesk plan-show"
    - name: "状态栏进度"
      command: "photodesk progress"
    - name: "取消（进行中的任务）"
      command: "photodesk cancel"
    - name: "导入验收测试图…"
      missing: "没有命令：经 PhotoKit 向本人的系统图库新建一张合成测试图，要 App 自己的照片写入授权并真的改动图库，只在 App 内"
    - name: "在“照片”中打开"
      human: "只在窗口里有意义：在“照片”App 里定位显示这张照片"
    - name: "在“照片”中查看"
      human: "只在窗口里有意义：打开“照片”App"
    - name: "打开本地记录"
      human: "只在窗口里有意义：在访达中显示数据目录；内容用 records、plans 读"
    - name: "错误提示的收起"
      human: "只在窗口里有意义；命令的失败原因在 --json 的 error 里"
    - name: "完全磁盘访问权限"
      human: "系统授权须真人在系统设置里开；是否到位用 doctor 读"
    - name: "照片访问权限"
      human: "系统授权须真人在系统设置里开"
    - name: "在 Finder 显示 App"
      human: "只在窗口里有意义：在访达中显示"
    - name: "设置…"
      command: "photodesk settings"
    - name: "当前图库"
      command: "photodesk settings"
    - name: "打开 PhotoDesk 后自动整理"
      command: "photodesk settings set"
    - name: "登录 Mac 时启动"
      command: "photodesk login"
    - name: "默认时间线"
      command: "photodesk settings set"
    - name: "外观"
      command: "photodesk settings set"
    - name: "照片大小"
      command: "photodesk settings set"
    - name: "时间线包含共享相册（只读）"
      command: "photodesk settings set"
    - name: "在本机识别图像内容与文字"
      command: "photodesk settings set"
    - name: "检查新照片"
      command: "photodesk settings set"
    - name: "后台处理强度"
      command: "photodesk settings set"
    - name: "重试失败的识别"
      command: "photodesk refresh"
    - name: "同一片段最长间隔"
      command: "photodesk settings set"
    - name: "同一片段地点距离"
      command: "photodesk settings set"
    - name: "会议资料关联时间"
      command: "photodesk settings set"
    - name: "已命名的猫"
      command: "photodesk settings set"
    - name: "进入重复核对时预选建议删除项"
      command: "photodesk settings set"
    - name: "录制快捷键"
      human: "要真人按键"
    - name: "已绑定的快捷键与冲突提示"
      command: "photodesk shortcuts"
    - name: "快捷键作用范围（仅 PhotoDesk 内 / 全局）"
      command: "photodesk shortcuts scope"
    - name: "清除绑定 / 清除所有快捷键"
      command: "photodesk shortcuts clear"
    - name: "版本与构建"
      command: "photodesk doctor"
    - name: "原生操作说明"
      human: "只在窗口里有意义：窗口内按键操作的说明文字"
    - name: "显示主窗口"
      human: "只在窗口里有意义"
    - name: "PhotoDesk 安装与使用教程"
      human: "只在窗口里有意义：打开帮助页"
    - name: "配置与更新…"
      human: "只在窗口里有意义：打开配置与更新窗口"
    - name: "使用 iCloud 记住配置"
      command: "photodesk config sync"
    - name: "iCloud 配置同步状态（开关下面那句实时状态）"
      missing: "读不到的展示：这句话由运行中的 App 持有，命令只在自己执行 config sync on 或 config import 时回报那一次同步的结果"
    - name: "导出配置…"
      command: "photodesk config export"
    - name: "导入配置…"
      command: "photodesk config import"
    - name: "检查更新"
      command: "photodesk update check"
    - name: "升级到新版…"
      missing: "命令不做静默安装（做得到，只是不做）：photodesk update check 给出新版、按钮名、安装包地址与步骤，替换并重启 App 仍在「配置与更新…」窗口确认"
  measure:
    archive: release
  budget:
    memory_mb: 250
  test: bash scripts/test.sh
  accept:
    functionality: uv run python scripts/accept/functionality.py
    recovery: uv run python scripts/accept/recovery.py
    privacy: uv run --group build python scripts/accept/privacy.py
    native_ui: uv run python scripts/accept/native_ui.py
  source:
  - Sources/**
  - backend/**/*.py
  - backend/defaults.yaml
  - Info.plist
  - PhotoDesk.xcodeproj/**
  - build.sh
  - scripts/build_engine.sh
  - scripts/install_app.py
  - scripts/collect_notices.py
  - scripts/compress_icon.py
  - scripts/strip_release.py
  - pyproject.toml
  - uv.lock
  - icon/AppIcon.icns
  test_inputs:
  - tests/**
  - scripts/accept/*.py
  - scripts/test.sh
  ui:
  - Sources/**
  - Info.plist
  - icon/**
  - PhotoDesk.xcodeproj/**
  media:
  - docs/demo/*.png
  - docs/demo/*.mp4
  - docs/demo/tutorial.md
  media_meta: docs/demo/recording.json
  release: dist/release.json
  build_number: git-count
  site_build: python3 scripts/build_site.py
  site_deploy: products-only
  product:
    distribution: public
    source_visibility: public
    source_url: https://github.com/zengtianli/photo-desk
    rationale: 按时间与内容整理照片，先看清分组和建议，再决定如何处理。 面向外部使用者提供现有公开产品与源码入口，持续维护获取、教程和版本证据。
